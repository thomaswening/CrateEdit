name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Requirement links in docs
        run: dotnet run tools/RequirementLinks.cs -- --check
      # The native xUnit runner writes an XML report that includes the requirement tags.
      - name: Test
        run: dotnet tests/CrateEdit.Tests/bin/Release/net10.0/CrateEdit.Tests.dll -xml TestResults/results.xml
      - name: Requirements traceability
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          dotnet run tools/Traceability.cs -- \
            --requirements docs/requirements.md \
            --manual docs/manual-verification.md \
            --results TestResults/results.xml \
            --output TestResults/traceability.md > /dev/null || status=$?
          cat TestResults/traceability.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
