# Source checks, build and tests, traceability and phase exit check, formatting and a coverage report.
# What each job checks and what to do when it fails:
# https://github.com/thomaswening/CrateEdit/blob/main/docs/development.md#continuous-integration
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Coding guideline: invisible characters as escapes. Lists every line with a literal one.
      - name: No invisible characters in C# sources
        run: |
          if git grep -nP '(?<!^)\x{FEFF}|[\x{00A0}\x{00AD}\x{200B}-\x{200D}\x{2060}]' -- '*.cs'; then exit 1; fi

  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build -c Release
      - name: Requirement links in docs
        run: dotnet run tools/RequirementLinks.cs -- --check
      # The native xUnit runner writes an XML report that includes the requirement tags.
      - name: Test
        run: dotnet tests/CrateEdit.Tests/bin/Release/net10.0/CrateEdit.Tests.dll -xml TestResults/results.xml
      - name: Requirements traceability and phase exit check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          dotnet run tools/Traceability.cs -- \
            --requirements docs/requirements.md \
            --manual docs/manual-verification.md \
            --results TestResults/results.xml \
            --roadmap docs/roadmap.md \
            --output TestResults/traceability.md > /dev/null || status=$?
          cat TestResults/traceability.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Code matches .editorconfig
        run: dotnet format CrateEdit.slnx --verify-no-changes

  coverage:
    name: Coverage report (informational)
    runs-on: ubuntu-latest
    # The report informs reviews; a drop in coverage never blocks a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build -c Release
      - name: Test with coverage
        run: >
          dotnet dotnet-coverage collect -f cobertura -o TestResults/coverage.cobertura.xml
          "dotnet tests/CrateEdit.Tests/bin/Release/net10.0/CrateEdit.Tests.dll"
      - name: Report
        shell: bash
        run: |
          dotnet reportgenerator -reports:TestResults/coverage.cobertura.xml -targetdir:TestResults/coverage \
            "-reporttypes:Html;MarkdownSummaryGithub" "-assemblyfilters:+CrateEdit.Core;+CrateEdit.App"
          cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: TestResults/coverage
