# Weekly update pull requests for NuGet packages (Directory.Packages.props), the .NET tools
# (dotnet-tools.json) and the GitHub Actions in .github/workflows.
# How to handle them: https://github.com/thomaswening/CrateEdit/blob/main/docs/development.md#dependency-updates
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # One pull request for all minor and patch updates; each major update gets its own.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Avalonia.Headless.XUnit 12.1.x is built against xunit.v3 3.x and fails test discovery on 4.x
      # (MissingMethodException, see #28). Remove once Avalonia ships a release for xunit.v3 4.
      - dependency-name: xunit.v3
        versions: [">= 4.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
